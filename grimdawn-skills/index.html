<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grim Dawn Skill Database</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Every class skill in Grim Dawn, with the full in-game tooltip for each rank.">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="database">

<div class="header">
  <div class="logo">
    <div class="logo-text">Grim Dawn Skill Database</div>
    <!-- <div class="mod-info"><div class="mod-name">Base Game</div><div class="mod-version">1.3.0.6</div></div> -->
  </div>
</div>

<div id="content" class="main-container">

  <div class="top-bar">
    <div class="bar-mid">
      <div class="input-block" id="input-block">
        <input id="input-search" class="input search" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search skills, stats, descriptions&hellip;">
        <span class="search-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg>
        </span>
        <a id="search-clear" class="search-clear" title="Clear search">&nbsp;</a>
      </div>
    </div>
    <div class="bar-right">
      <label class="char-level" title="Scales pet health and energy.">
        <span>Char level</span>
        <input id="char-level" type="number" min="1" max="110" step="1" value="100">
      </label>
      <div class="rank-mode" id="rank-mode" title="Which rank every skill is shown at">
        <div class="tab selected" data-mode="1">Rank 1</div>
        <div class="tab" data-mode="max">Max</div>
        <div class="tab" data-mode="ult">Ultimate</div>
      </div>
    </div>
  </div>

  <div class="top-bar secondary">
    <div class="class-selector" id="class-selector"></div>
  </div>

  <div id="skill-list" class="skill-list"></div>
</div>

<div class="footer">
  <div class="copy">
    Not affiliated with Crate Entertainment.
  </div>
</div>

<script src="data/strings.js"></script>
<script src="data/skills.js"></script>
<script src="js/format.js"></script>
<script src="js/app.js"></script>
</body>
</html>
